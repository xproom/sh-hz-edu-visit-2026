<!doctype html>
<html lang="ko" data-fs="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f3a66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="상하이 출장">
<meta name="robots" content="noindex, nofollow">
<title>상하이·항저우 출장</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="css/style.css?v=19">
<script>try{var f=localStorage.getItem('tm-fs-v2');if(f)document.documentElement.dataset.fs=f;}catch(e){}</script>
</head>
<body>
<header class="topbar">
  <a class="emblem" href="#home" data-act="home" aria-label="처음 화면으로"><img src="img/logo-emblem.jpg" alt="부산광역시교육청" width="42" height="42"></a>
  <div class="brand">
    <a class="home-link" href="#home" data-act="home"><b>상하이·항저우 출장</b></a>
    <button class="who" data-act="name" id="who">기록자 설정</button>
  </div>
  <div class="clocks" role="timer" aria-label="현재 시각">
    <div class="clk"><span class="lb">한국</span><b id="clkKR">--:--</b></div>
    <div class="clk cn"><span class="lb">중국</span><b id="clkCN">--:--</b></div>
  </div>
  <div class="fs-btns" role="group" aria-label="글자 크기">
    <button data-fs="1" aria-label="보통 글씨">가</button>
    <button data-fs="2" aria-label="큰 글씨">가</button>
    <button data-fs="3" aria-label="아주 큰 글씨">가</button>
  </div>
</header>
<div class="sync" id="sync" role="status" aria-live="polite"></div>

<main id="app" tabindex="-1"></main>

<nav class="bottom-nav" aria-label="주요 메뉴">
  <a href="#home" data-nav="home"><span class="ico">🗓️</span>일정</a>
  <a href="#orgs" data-nav="orgs"><span class="ico">✏️</span>기관 기록</a>
  <a href="#daily" data-nav="daily"><span class="ico">📅</span>일일보고</a>
  <a href="#report" data-nav="report"><span class="ico">📄</span>보고서</a>
</nav>

<div class="sheet-modal" id="nameModal" role="dialog" aria-modal="true" aria-labelledby="nmTitle">
  <div class="box">
    <h3 id="nmTitle">기록자 이름을 입력하세요</h3>
    <p class="muted">직책 없이 이름만 적어 주세요. 기록과 사진에 작성자로 표시됩니다.</p>
    <input class="inp" id="nameInput" placeholder="예: 손제득" autocomplete="name">
    <button class="btn" data-act="name-save" style="width:100%;margin-top:14px">확인</button>
  </div>
</div>
<div class="taxi-overlay" id="taxi" role="dialog" aria-modal="true"></div>
<div class="viewer" id="viewer"><img alt=""></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/config.js?v=19"></script>
<script src="js/data.js?v=19"></script>
<script src="js/app.js?v=19"></script>
</body>
</html>
